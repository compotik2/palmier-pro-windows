<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palmier Pro Windows Port</title>
<style>body{font-family:Segoe UI,Arial;margin:0;background:#111;color:#eee}header{padding:12px 16px;background:#1c1c1c;border-bottom:1px solid #333}main{padding:16px;max-width:900px}button{background:#2d6cdf;border:0;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}pre{background:#1c1c1c;padding:12px;border-radius:8px;overflow:auto}.row{display:flex;gap:8px;margin:8px 0}</style>
</head>
<body>
<header><b>Palmier Pro — Windows Port</b> <span style="color:#888">MCP: http://127.0.0.1:19789/mcp</span></header>
<main>
<div class="row"><button onclick="api('get_timeline',{})">get_timeline</button><button onclick="api('manage_tracks',{action:'add',trackType:'video'})">+ track</button><button onclick="demo()">demo clip</button><button onclick="api('undo',{})">undo</button></div>
<pre id="out">ready</pre>
<script>
async function api(tool, args){
  const r = await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool,arguments:args})});
  document.getElementById('out').textContent = JSON.stringify(await r.json(),null,2);
}
async function demo(){
  await api('manage_tracks',{action:'add',trackType:'video'});
  const t = await (await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:'get_timeline',arguments:{}})}})).json();
  const trackId = t.result.tracks[0]?.trackId;
  await api('add_clips',{trackId,clips:[{start:0,end:90,mediaRef:'demo'}]});
}
</script>
</main>
</body>
</html>
